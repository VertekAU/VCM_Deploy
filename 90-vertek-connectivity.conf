# Managed by VCM_Deploy — NetworkManager connectivity check.
# Every 5 minutes NetworkManager fetches this page on each connection. A connection
# without internet gets its default route pushed behind LTE (and the DNS order moves
# with it); when the internet returns it is promoted again — failover and failback
# without a reboot. ~1 KB per check per connection (~9 MB/month on LTE).
# Tested on the test core with a UniFi internet block, 2026-10-16.
#
# Google's check page (HTTP 204, empty response expected), not Debian's: Debian's
# network-test.debian.org shares CDN addresses with deb.debian.org, so a venue blocking
# Debian's mirrors made NetworkManager fail Wi-Fi over to LTE needlessly (test core,
# 2026-10-18). Planned: an endpoint on our own server, so failover tracks Vertek reachability.
[connectivity]
enabled=true
uri=http://connectivitycheck.gstatic.com/generate_204
response=
interval=300
