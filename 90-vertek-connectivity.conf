# Managed by VCM_Deploy — NetworkManager connectivity check.
# Every 5 minutes NetworkManager fetches this page on each connection. A connection
# without internet gets its default route pushed behind LTE (and the DNS order moves
# with it); when the internet returns it is promoted again — failover and failback
# without a reboot. ~1 KB per check per connection (~9 MB/month on LTE).
# Tested on the test core with a UniFi internet block, 2026-10-16.
[connectivity]
enabled=true
uri=http://network-test.debian.org/nm
response=NetworkManager is online
interval=300
